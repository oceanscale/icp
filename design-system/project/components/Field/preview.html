<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Field · preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"></head>
<body>
<div id="root" class="dq-stage"></div>
<script>
  var D = window.Dossie, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 24, width: '100%' } },
      h(D.Field, { label: 'Segmento e porte', placeholder: 'Setor, funcionários, faturamento, região', hint: 'Use os 5 melhores clientes da carteira (RFV).' }),
      h(D.Field, { label: 'Ticket médio', defaultValue: 'R$ 48', error: 'Ticket abaixo do custo por lead do simulador.' }),
      h(D.Field, { label: 'Dor principal', multiline: true, rows: 3, defaultValue: 'O que trouxe o cliente até você? O que incomodava?' })));
</script>
</body>
</html>
